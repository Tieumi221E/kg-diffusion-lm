seed: 42
tokenizer:
  name_or_path: gpt2
  add_special_tokens:
    additional_special_tokens:
    - '[MASK]'
    - <BOS>
    - <start_id>user<end_id>
    - <start_id>assistant<end_id>
    - <eot_id>
    - <pad>
  max_length: 128
  pad_token: <pad>
data:
  train_jsonl: datasets/10000+500x10/pretrain/synthetic_logic_mixed_10000+500x_template_10_expanded.jsonl
  fixed_eval_jsonl: datasets/10000+500x10/pretrain/job_name_mask_eval.jsonl
  batch_size: 128
  eval_batch_size: 128
  num_workers: 8
  shuffle_buffer: 10000
collator:
  mask_token: '[MASK]'
  random_crop_prob: 0.01
  eps: 0.001
  prepend_bos: false
  append_eos: false
  mask_content_only: false
model:
  type: gpt2_bidirectional
  vocab_size: 50257
  hidden_size: 768
  num_hidden_layers: 12
  num_attention_heads: 12
  intermediate_size: 3072
  activation_function: swiglu
  layer_norm_type: rmsnorm
  rope_theta: 10000
  attention_dropout: 0.0
  resid_dropout: 0.0
  emb_dropout: 0.0
optimizer:
  name: adamw
  lr: 2.0e-05
  betas: &id001
  - 0.9
  - 0.95
  weight_decay: 0.1
  eps: 1.0e-08
scheduler:
  name: cosine
  max_lr: 2.0e-05
  min_lr: 2.0e-05
  warmup_steps: 2000
  total_steps: 50000
training:
  gradient_accumulation_steps: 1
  max_steps: 50000
  sequence_length: 128
  save_every: 5000
  log_every: 100
  eval_every: 1000
  clip_grad_norm: 1.0
  random_seed: 42
logging:
  project: kgdllm-pretrain
  run_name: mdm_pretrain_base
  output_dir: runs/pretrain
  keep_last_n_checkpoints: 0
  save_optimizer_state: true
dataset_key: kgd_10000
