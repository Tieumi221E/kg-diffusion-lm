seed: 42
tokenizer:
  name_or_path: gpt2
  add_special_tokens:
    additional_special_tokens:
    - '[MASK]'
    - <BOS>
    - <start_id>user<end_id>
    - <start_id>assistant<end_id>
    - <eot_id>
    - <pad>
  max_length: 128
  pad_token: <pad>
data:
  train_jsonl: datasets/1000+500x10/sft/ft_qa_pair_data_1000x_template_10_train.jsonl
  eval_jsonl: datasets/1000+500x10/sft/ft_qa_pair_data_1000x_template_10_val.jsonl
  batch_size: 192
  eval_batch_size: 384
  num_workers: 8
  context_separator: ''
collator:
  mask_token: '[MASK]'
  prepend_bos: true
  add_prompt_eos: false
  append_response_eos: true
  max_length: 128
  eps: 0.001
  answer_mask_scalar: 1.0
  answer_eos_mask_scalar: 1.0
  train_mask_mode: random
  partial_mask_min: null
  partial_mask_max: null
  eval_mask_mode: random
  eval_fixed_mask_option: null
  eval_block_size: 2
  eval_steps_per_block: 4
  eval_temperature: 0.8
  eval_top_k: 20
  eval_low_conf_threshold: 0.3
  answer_block_size: 4
model:
  type: gpt2_bidirectional
  vocab_size: 50257
  hidden_size: 768
  num_hidden_layers: 12
  num_attention_heads: 12
  intermediate_size: 3072
  activation_function: swiglu
  layer_norm_type: rmsnorm
  rope_theta: 10000
  attention_dropout: 0.0
  resid_dropout: 0.0
  emb_dropout: 0.0
optimizer:
  name: adamw
  lr: 2.0e-05
  betas: &id001
  - 0.9
  - 0.95
  weight_decay: 0.1
  eps: 1.0e-08
scheduler:
  name: constant
  max_lr: 2.0e-05
  min_lr: 2.0e-05
  warmup_steps: 50
  total_steps: 3000
training:
  gradient_accumulation_steps: 1
  max_steps: 3000
  log_every: 10
  eval_every: 100
  save_every: 500
  sequence_length: 128
  clip_grad_norm: 1.0
  mask_warmup_steps: 0
logging:
  project: kgdllm-sft
  run_name: mdm_sft_base
  output_dir: runs/sft
  keep_last_n_checkpoints: 1
dataset_key: kgd_1000
datasets:
  kgd_1000:
    data:
      train_jsonl: datasets/1000+500x10/sft/ft_qa_pair_data_1000x_template_10_train.jsonl
